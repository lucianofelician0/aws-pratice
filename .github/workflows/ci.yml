name: CI

on:
  push:
    branches: [master]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar as dependências
        run: npm ci

      - name: Correr os testes
        run: npm test